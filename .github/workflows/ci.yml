name: CI

# Two bars, scaled to the target branch:
#   PR -> dev     : `test` only, for fast feedback on the integration branch.
#   PR -> main    : `test` plus `lint`, `image`, `shellcheck`, `gosec`, `govulncheck`,
#                   `openapi`, `e2e` and `e2e-health` — the release bar.
#   push -> main  : the same release bar, so main's HEAD carries its own result.
# The main-only jobs are gated on `github.base_ref == 'main'` (populated on
# pull_request only) or `github.ref == 'refs/heads/main'` (the push of the merge
# commit), so they never queue on a dev PR but always run on what main actually
# holds. Branch protection is per branch, so `dev` requires `test` and `main`
# requires all nine.

on:
  pull_request:
    branches: [dev, main]
  # Push runs only on main. dev's ruleset enforces up-to-date branches
  # (strict status checks), so the PR run already tested the exact tree the
  # merge produces — a dev push run would repeat it. main's ruleset is not
  # strict, so the post-merge tree can differ from what the PR tested; this
  # push run is the safety net for that gap.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so an upstream release cannot turn a protected branch red overnight.
  GOLANGCI_LINT_VERSION: v2.12.2
  GOSEC_VERSION: v2.28.0
  GOVULNCHECK_VERSION: v1.6.0
  REDOCLY_VERSION: 2.46.2
  COVERAGE_FLOOR: 90

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # docs/THREAT-MODEL.md promises every claim traces back to a line of
      # code, and docs/BACKUP.md quotes README.md and install.sh the same way.
      # Those citations silently rot whenever a prose file grows (#48), so they
      # are checked on every PR rather than only on the release bar.
      - name: Check doc citations
        run: sh scripts/check-doc-citations.sh

      # -race is implemented in cgo, so it needs CGO_ENABLED=1 even though the
      # shipped binary is built with CGO_ENABLED=0. gcc ships on ubuntu-latest.
      #
      # Coverage is measured over ./internal/... only, matching `make cover`:
      # cmd/ is wiring exercised by the manual checklist, and folding it in would
      # misreport the number for the code that is actually unit-testable. The two
      # commands together still run every test in the module exactly once.
      - name: Test ./internal/... with coverage
        env:
          CGO_ENABLED: 1
        run: go test ./internal/... -race -coverprofile=coverage.out

      - name: Test ./cmd/...
        env:
          CGO_ENABLED: 1
        run: go test ./cmd/... -race

      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage over ./internal/...: ${total}% (floor ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }'; then
            echo "::error::coverage ${total}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
          echo "coverage ${total}% meets the ${COVERAGE_FLOOR}% floor"

  lint:
    name: lint
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `gofmt -l` exits 0 even when it lists files, so the output is what fails.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...

  image:
    name: image
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Proves the CGO_ENABLED=0 / distroless-static path still links and runs.
      - name: docker build
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${GITHUB_SHA::7} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t devmon-agent:ci .

  # install.sh is the path a new operator takes to their first paired device,
  # and it is the one artifact here no Go gate covers. shellcheck runs on the
  # release bar for the same reason gosec does: a fault in it lands on
  # someone's host, not in a build log. ubuntu-latest ships shellcheck, so this
  # needs no install step and no third-party action.
  shellcheck:
    name: shellcheck
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -s sh install.sh

  gosec:
    name: gosec
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source rather than via a third-party action, to keep the
      # supply-chain surface of a security gate as small as possible.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: gosec
        run: gosec ./...

  # docs/openapi.yaml is the contract the client is generated from, and it is
  # hand-maintained: no Go gate reads it, so nothing else in this workflow would
  # notice it going malformed. This job is the floor — it proves the document
  # still parses as OpenAPI 3.1 and passes redocly's recommended rules. It
  # cannot check the document against the registered routes; that is still
  # review's job, and CONTRIBUTING.md says so.
  #
  # Release bar rather than every dev PR: a spec fault cannot break a running
  # agent, only a client generated from a release.
  openapi:
    name: openapi
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same version the Makefile names, so a local
      # `make openapi-lint` and this job cannot disagree.
      - name: redocly lint
        run: npx --yes @redocly/cli@${REDOCLY_VERSION} lint docs/openapi.yaml

  # gosec and govulncheck answer different questions and neither substitutes for
  # the other: gosec looks for faults in the code written here, govulncheck for
  # known vulnerabilities in the dependencies and the Go toolchain underneath it.
  # The second question is the one no other gate asks, and it is not theoretical
  # — its first manual run, during the Phase 7 security review, reported
  # GO-2026-5856 in the toolchain and produced the Go 1.26.5 bump. That finding
  # arrived because someone remembered to run it by hand; this job is what makes
  # the next one arrive on its own.
  #
  # Installed from source and pinned, for the same supply-chain reason gosec is.
  govulncheck:
    name: govulncheck
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      # Reachability analysis over the module. The e2e packages sit behind a
      # build tag and are test-only, so they are deliberately out of scope: a
      # vulnerability that only a test harness can reach does not ship.
      - name: govulncheck
        run: govulncheck ./...

  # The end-to-end suite runs the real binary — and the real image — against the
  # runner's own Docker Engine. It takes minutes, so it stays on the release bar
  # rather than taxing every integration PR into dev.
  e2e:
    name: e2e
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker version
        run: docker version

      # DEVMON_E2E_REQUIRE turns "no Engine answered, skipping" from a silent
      # green into a hard failure. A suite that quietly does nothing is worse
      # than no suite, because a green run is what marks the phase done.
      - name: make e2e
        env:
          DEVMON_E2E_REQUIRE: 1
        run: make e2e

      - name: e2e lint
        run: make e2e-lint

  # The runner's own Engine cannot answer the one question this job asks.
  # ContainerSummary.Health was added in Docker API v1.52 (Engine 29) and
  # ubuntu-latest still ships API 1.48, so TestContainerListReportsHealth skips
  # in the `e2e` job above and the shipped `health` key of GET /v1/containers
  # has never been verified by CI (#15). This job gives that one test an Engine
  # 29 daemon to run against.
  #
  # Scope is deliberately one test, not the whole suite: a dind daemon reached
  # over tcp:// is a different environment from the runner's local socket, and
  # the in-container group cannot run against it at all — it bind-mounts the
  # daemon's socket, which a tcp:// endpoint has no local file for. The `e2e`
  # job stays the suite's home; this is a single-assertion supplement.
  e2e-health:
    name: e2e-health
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      # Pinned for the same reason every other tool version here is: an upstream
      # release must not be able to turn a protected branch red overnight.
      # --privileged is what dind needs to run its own daemon, and an empty
      # DOCKER_TLS_CERTDIR is what makes that daemon listen on plain 2375
      # instead of TLS on 2376.
      engine:
        image: docker:29.7.2-dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A service container counts as started as soon as its process is up; the
      # daemon inside it answers a little later. Poll rather than sleep, and
      # print the version that answered — the API version in that output is the
      # premise this whole job rests on.
      - name: Wait for the Engine 29 service
        run: |
          for _ in $(seq 1 30); do
            if docker -H tcp://127.0.0.1:2375 version; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the dind service did not answer within 60s"
          exit 1

      # DEVMON_E2E_DOCKER_HOST points both the harness and the agent binary it
      # starts at the service daemon instead of the runner's own.
      #
      # The grep is the point of the job. The version gate inside the test is a
      # t.Skipf that DEVMON_E2E_REQUIRE=1 deliberately does not convert into a
      # failure, so a run against an unexpectedly old daemon — or a renamed or
      # deleted test — would otherwise report a bare `ok` and imply coverage it
      # does not have, which is the exact failure #15 is about. Requiring the
      # PASS line means only an assertion that actually ran can make this green.
      - name: Verify the health projection against Engine 29
        env:
          DEVMON_E2E_REQUIRE: 1
          DEVMON_E2E_DOCKER_HOST: tcp://127.0.0.1:2375
        run: |
          set -o pipefail
          make e2e-health 2>&1 | tee e2e-health.log
          if ! grep -q '^--- PASS: TestContainerListReportsHealth' e2e-health.log; then
            echo "::error::TestContainerListReportsHealth did not run to a PASS; the health projection is still unverified"
            exit 1
          fi
