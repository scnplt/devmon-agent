name: CI

# Two bars, scaled to the target branch:
#   PR -> dev     : `test` only, for fast feedback on the integration branch.
#   PR -> main    : `test` plus `lint`, `image`, `shellcheck`, `gosec`, `govulncheck`
#                   and `e2e` — the release bar.
#   push -> main  : the same release bar, so main's HEAD carries its own result.
# The main-only jobs are gated on `github.base_ref == 'main'` (populated on
# pull_request only) or `github.ref == 'refs/heads/main'` (the push of the merge
# commit), so they never queue on a dev PR but always run on what main actually
# holds. Branch protection is per branch, so `dev` requires `test` and `main`
# requires all seven.

on:
  pull_request:
    branches: [dev, main]
  # Push runs only on main. dev's ruleset enforces up-to-date branches
  # (strict status checks), so the PR run already tested the exact tree the
  # merge produces — a dev push run would repeat it. main's ruleset is not
  # strict, so the post-merge tree can differ from what the PR tested; this
  # push run is the safety net for that gap.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so an upstream release cannot turn a protected branch red overnight.
  GOLANGCI_LINT_VERSION: v2.12.2
  GOSEC_VERSION: v2.28.0
  GOVULNCHECK_VERSION: v1.6.0
  COVERAGE_FLOOR: 90

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -race is implemented in cgo, so it needs CGO_ENABLED=1 even though the
      # shipped binary is built with CGO_ENABLED=0. gcc ships on ubuntu-latest.
      #
      # Coverage is measured over ./internal/... only, matching `make cover`:
      # cmd/ is wiring exercised by the manual checklist, and folding it in would
      # misreport the number for the code that is actually unit-testable. The two
      # commands together still run every test in the module exactly once.
      - name: Test ./internal/... with coverage
        env:
          CGO_ENABLED: 1
        run: go test ./internal/... -race -coverprofile=coverage.out

      - name: Test ./cmd/...
        env:
          CGO_ENABLED: 1
        run: go test ./cmd/... -race

      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage over ./internal/...: ${total}% (floor ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }'; then
            echo "::error::coverage ${total}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
          echo "coverage ${total}% meets the ${COVERAGE_FLOOR}% floor"

  lint:
    name: lint
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `gofmt -l` exits 0 even when it lists files, so the output is what fails.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...

  image:
    name: image
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Proves the CGO_ENABLED=0 / distroless-static path still links and runs.
      - name: docker build
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${GITHUB_SHA::7} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t devmon-agent:ci .

  # install.sh is the path a new operator takes to their first paired device,
  # and it is the one artifact here no Go gate covers. shellcheck runs on the
  # release bar for the same reason gosec does: a fault in it lands on
  # someone's host, not in a build log. ubuntu-latest ships shellcheck, so this
  # needs no install step and no third-party action.
  shellcheck:
    name: shellcheck
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -s sh install.sh

  gosec:
    name: gosec
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source rather than via a third-party action, to keep the
      # supply-chain surface of a security gate as small as possible.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: gosec
        run: gosec ./...

  # gosec and govulncheck answer different questions and neither substitutes for
  # the other: gosec looks for faults in the code written here, govulncheck for
  # known vulnerabilities in the dependencies and the Go toolchain underneath it.
  # The second question is the one no other gate asks, and it is not theoretical
  # — its first manual run, during the Phase 7 security review, reported
  # GO-2026-5856 in the toolchain and produced the Go 1.26.5 bump. That finding
  # arrived because someone remembered to run it by hand; this job is what makes
  # the next one arrive on its own.
  #
  # Installed from source and pinned, for the same supply-chain reason gosec is.
  govulncheck:
    name: govulncheck
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      # Reachability analysis over the module. The e2e packages sit behind a
      # build tag and are test-only, so they are deliberately out of scope: a
      # vulnerability that only a test harness can reach does not ship.
      - name: govulncheck
        run: govulncheck ./...

  # The end-to-end suite runs the real binary — and the real image — against the
  # runner's own Docker Engine. It takes minutes, so it stays on the release bar
  # rather than taxing every integration PR into dev.
  e2e:
    name: e2e
    # Release bar. `base_ref` covers the PR into main; `ref` covers the push of
    # the merge commit onto main, where `base_ref` is empty.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker version
        run: docker version

      # DEVMON_E2E_REQUIRE turns "no Engine answered, skipping" from a silent
      # green into a hard failure. A suite that quietly does nothing is worse
      # than no suite, because a green run is what flips a PRD row.
      - name: make e2e
        env:
          DEVMON_E2E_REQUIRE: 1
        run: make e2e

      - name: e2e lint
        run: make e2e-lint
